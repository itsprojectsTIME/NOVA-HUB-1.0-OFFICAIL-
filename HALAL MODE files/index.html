
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Mode</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://i.pinimg.com/736x/25/e3/d3/25e3d314c1cd1c1021ff7e702a88a686.jpg">
</head>
<body>

    <header>
        <h1>🌙 Halal Mode</h1>
        <p>A peaceful space for your daily life.</p>
    </header>

    <main>
        <h2>Welcome to Halal Mode</h2>
        <p>Your new experience starts here.</p>
        <h2 id="date"></h2>
        <p id="prayer-progress">0 / 5 prayers completed</p>
        <div id="prayercounts" class="container">
            <h4 id="fajr">LOADING-fajr</h4>
            <input type="checkbox" id="fajr-check">
            <h4 id="dhuhr">LOADING-duhr</h4>
            <input type="checkbox" id="dhuhr-check">
            <h4 id="asr">LOADING-asr</h4>
            <input type="checkbox" id="asr-check">
            <h4 id="maghrib">LOADING-magrib</h4>
            <input type="checkbox" id="maghrib-check">
            <h4 id="isha">LOADING-isha</h4>
            <input type="checkbox" id="isha-check">
            <p id="completion-message"></p>
        </div>
        <div>

        </div>
        <section id="adhkar-center">
    <h2>🌙 Adhkar Center</h2>
    <p>Your daily remembrance of Allah.</p>

    <div class="adhkar-options">
        <button id="morning-adhkar">Morning Adhkar</button>
        <button id="evening-adhkar">Evening Adhkar</button>
    </div>
    <div id="adhkar-content">
    <h3 id="adhkar-title"></h3>
    <div id="adhkar-list"></div>
    <p id="adhkar-counter-left">0/25</p>
    <p id="repeat-counter"></p>
<button id="repeat-button">count</button>
</div>
    <button id="back">back</button>
    <button id="next">next</button>
</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
