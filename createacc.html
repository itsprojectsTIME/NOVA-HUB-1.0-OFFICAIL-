<html lang="en">
    <head>
        <title>NOVA HUB | Create account</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="login.css">
        <link rel="icon" type="image/jpeg" href="I AM.... STEVEEE.jpg"> 
    </head>
    <body>
        <header id="login-title">
                    <h1>join NOVA HUB</h1>
        <p>please log in OR create account for full acsess features!</p>
        </header>
        <main class="login-container">
    <form id="CreateAccountForm">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Please enter your username" required minlength="3" maxlength="21" pattern="[A-Za-z0-9]+">
            <label for="email">Email*</label>
            <input type="email" id="email" placeholder="please enter your info..." required>
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="please enter your password..." required minlength="8" maxlength="40" pattern="[A-Za-z0-9]+" title="Use 8–40 characters, including at least one letter and one number.">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required title="Use 8–40 characters, including at least one letter and one number.">
            <p id="informer" style="color: red;"></p>
            <button type="submit" id="submitcreatingaccount">CREATE ACCOUNT</button>
        </form>
                <nav>
            <a href="index.html">login as guest...</a>
            <a href="login.html">have account...what are you WAIT for</a>
        </nav>
</main>
        <script src="createacc.js"></script>
    </body>

</html>
