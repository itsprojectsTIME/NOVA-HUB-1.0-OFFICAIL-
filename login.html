<html lang="en">
    <head>
        <title>NOVA HUB | Login account</title>

        <link rel="stylesheet" href="login.css">

    <body>
        <header id="login-title">
        <h1>Welcome back sir!</h1>
        <p>please log in for full acsess features!</p>
        </header>
        <main class="login-container">
    <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Please enter your username" minlength="4" maxlength="40" pattern="[A-Za-z0-9]+">
            <label for="email">Email*</label>
            <input type="email" id="email" placeholder="please enter your info..." minlength="8" maxlength="31" >
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="please enter your password..." minlength="8" maxlength="40" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,40}" title="Use 8–40 characters, including at least one letter and one number.">
            <p id="informer" style="color: red;"></p>
            <button type="submit" id="submitcreatingaccount">LOGIN</button>
        </form>
                <nav>
            <a href="index.html">login as guest...</a>

        </nav>
</main>
